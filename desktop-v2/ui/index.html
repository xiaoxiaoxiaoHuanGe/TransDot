<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:">
<title>TransDot · 轻量桌面版</title>
<style>
*{box-sizing:border-box}body{font:15px "Segoe UI","Microsoft YaHei",sans-serif;color:#203967;background:linear-gradient(132deg,#e9f3ff,#fff 60%,#e5f1ff);margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(480px,calc(100vw - 30px));background:#fff;border:1px solid #dce7fa;border-radius:22px;box-shadow:0 18px 70px #1553a51e;padding:34px}.mark{background:linear-gradient(135deg,#1fc4ff,#1046da);color:white;border-radius:16px;width:52px;height:52px;display:grid;place-items:center;font-size:25px;font-weight:bold}h1{font-size:24px;margin:22px 0 8px}p{line-height:1.7;color:#7484a0}label{display:block;font-weight:600;margin-top:26px}input{width:100%;font:inherit;border-radius:10px;border:1px solid #ccdaf0;padding:13px;margin-top:10px;outline-color:#3d8cff}button{width:100%;border:0;border-radius:10px;background:linear-gradient(110deg,#297bfa,#1356c5);color:white;font:inherit;font-weight:600;margin-top:16px;padding:13px;cursor:pointer}#error{color:#c43b54;min-height:18px}small{display:block;color:#7e8da6;line-height:1.6}</style>
</head><body><main><div class="mark">T.</div><h1>TransDot Desktop 2.0</h1><p>轻量 Windows 客户端。连接你自己的服务器，然后在 Android APP 扫码配对。收到新的文字和图片时，自动写入系统剪贴板。</p>
<form id="serverForm"><label for="server">服务器 HTTPS 地址</label><input id="server" type="url" placeholder="https://transdot.example.com:9004" required><button>连接服务器</button></form>
<p id="error" role="alert"></p><small>无需更新服务器。关闭窗口将继续驻留系统托盘；托盘菜单可以暂停复制、切换服务器以及设置开机启动。</small></main>
<script>
const input=document.getElementById('server');
const error=document.getElementById('error');
const invoke=(name,args)=>window.__TAURI_INTERNALS__.invoke(name,args);
invoke('get_settings').then(data=>{input.value=data.serverUrl||''}).catch(e=>error.textContent=String(e));
document.getElementById('serverForm').addEventListener('submit',async(event)=>{
 event.preventDefault();error.textContent='';
 try {await invoke('configure_server',{value:input.value.trim()});}
 catch(e){error.textContent=String(e)}
});
</script></body></html>
