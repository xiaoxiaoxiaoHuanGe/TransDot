name: Publish TransDot Desktop v2.0.3
on:
  push:
    branches: [main]
    paths:
      - 'desktop-v2/**'
      - '.github/workflows/release-windows-tauri.yml'
      - '.github/release-notes/desktop-v2.0.3.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop-v2/src-tauri -> target'
      - name: Install desktop dependencies
        working-directory: desktop-v2
        run: npm install --no-audit --no-fund
      - name: Generate icons
        working-directory: desktop-v2
        run: npm run icons
      - name: Run JS integration tests
        working-directory: desktop-v2
        run: npm test
      - name: Run Rust tests
        working-directory: desktop-v2/src-tauri
        run: cargo test
      - name: Build Windows installer
        working-directory: desktop-v2
        run: npm run build
      - name: Verify installer and make SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop-v2/package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '2.0.3') { throw "Wrong version $version" }
          $exeFiles = @(Get-ChildItem 'desktop-v2/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($exeFiles.Count -ne 1) { throw "Expected one installer, got $($exeFiles.Count)" }
          $exe = $exeFiles[0]
          if ($exe.Name -notmatch '2\.0\.3') { throw "Wrong installer filename $($exe.Name)" }
          if ($exe.Length -gt 15MB) { throw "Installer exceeds 15 MiB target" }
          $digest = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLowerInvariant()
          "$digest  $($exe.Name)" | Set-Content -Path "$($exe.FullName).sha256" -Encoding ascii
          Write-Host "$($exe.Name) = $([math]::Round($exe.Length / 1MB, 2)) MiB, SHA-256 $digest"
      - name: Create official GitHub Release with installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v2.0.3'
          # gh release create fails without overwriting anything if the tag already exists.
          $exe = @(Get-ChildItem 'desktop-v2/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')[0]
          gh release create $tag "$($exe.FullName)" "$($exe.FullName).sha256" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'TransDot Desktop v2.0.3 (Windows)' --notes-file '.github/release-notes/desktop-v2.0.3.md' --latest
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
      - name: Upload installer artifact as backup
        uses: actions/upload-artifact@v4
        with:
          name: TransDot-Desktop-v2.0.3-Windows
          path: |
            desktop-v2/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop-v2/src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
          if-no-files-found: error
